<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>休息一下吧 ☁️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&display=swap');

  :root {
    --warm-1: #fef3e2;
    --warm-2: #fde8cd;
    --warm-3: #f9d5b8;
    --warm-4: #f5c09a;
    --text-1: #5a4636;
    --text-2: #8a7565;
    --text-3: #b5a395;
    --accent: #e8956d;
    --accent-glow: rgba(232, 149, 109, 0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Serif SC', serif;
    background: linear-gradient(160deg, #fef9f0 0%, #fde8cd 40%, #f5d0a9 100%);
    min-height: 100vh;
    overflow: hidden;
    color: var(--text-1);
    position: relative;
  }

  /* ====== 飘动的云朵 ====== */
  .clouds {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .cloud {
    position: absolute;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 100px;
    filter: blur(1px);
    animation: floatCloud linear infinite;
  }

  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 50%;
  }

  .cloud-1 {
    width: 120px; height: 40px; top: 8%;
    animation-duration: 45s;
    opacity: 0.5;
  }
  .cloud-1::before { width: 50px; height: 50px; top: -25px; left: 20px; }
  .cloud-1::after { width: 70px; height: 60px; top: -30px; left: 50px; }

  .cloud-2 {
    width: 90px; height: 30px; top: 15%;
    animation-duration: 55s;
    animation-delay: -15s;
    opacity: 0.4;
  }
  .cloud-2::before { width: 40px; height: 40px; top: -20px; left: 15px; }
  .cloud-2::after { width: 55px; height: 45px; top: -22px; left: 35px; }

  .cloud-3 {
    width: 150px; height: 45px; top: 5%;
    animation-duration: 60s;
    animation-delay: -30s;
    opacity: 0.35;
  }
  .cloud-3::before { width: 60px; height: 55px; top: -28px; left: 25px; }
  .cloud-3::after { width: 80px; height: 65px; top: -32px; left: 60px; }

  @keyframes floatCloud {
    from { transform: translateX(-200px); }
    to { transform: translateX(calc(100vw + 200px)); }
  }

  /* ====== 粒子/光点 ====== */
  .particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .particle {
    position: absolute;
    width: 4px; height: 4px;
    background: var(--accent);
    border-radius: 50%;
    opacity: 0;
    animation: sparkle ease-in-out infinite;
  }

  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: translateY(0) scale(0.5); }
    50% { opacity: 0.6; transform: translateY(-20px) scale(1); }
  }

  /* ====== 主容器 ====== */
  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    text-align: center;
  }

  /* ====== 开场动画 ====== */
  .hero-section {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeInUp 1.2s ease-out 0.3s forwards;
  }

  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .breath-circle {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232, 149, 109, 0.15) 0%, rgba(232, 149, 109, 0.05) 70%, transparent 100%);
    border: 2px solid rgba(232, 149, 109, 0.2);
    margin: 0 auto 30px;
    animation: breathe 4s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); border-color: rgba(232, 149, 109, 0.2); }
    50% { transform: scale(1.08); border-color: rgba(232, 149, 109, 0.4); }
  }

  .main-title {
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 300;
    color: var(--text-1);
    letter-spacing: 4px;
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeInUp 1s ease-out 0.8s forwards;
  }

  .sub-title {
    font-size: clamp(14px, 3vw, 17px);
    color: var(--text-2);
    font-weight: 300;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeInUp 1s ease-out 1.2s forwards;
    line-height: 1.8;
  }

  /* ====== 休息计时器 ====== */
  .timer-section {
    opacity: 0;
    animation: fadeInUp 1s ease-out 1.5s forwards;
    width: 100%;
    max-width: 400px;
  }

  .timer-display {
    position: relative;
    width: 200px; height: 200px;
    margin: 0 auto 30px;
  }

  .timer-ring {
    width: 200px; height: 200px;
    transform: rotate(-90deg);
  }

  .timer-ring-bg {
    fill: none;
    stroke: rgba(232, 149, 109, 0.12);
    stroke-width: 6;
  }

  .timer-ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 565.48;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear;
    filter: drop-shadow(0 0 6px var(--accent-glow));
  }

  .timer-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .timer-minutes {
    font-size: 42px;
    font-weight: 300;
    color: var(--text-1);
    line-height: 1;
  }

  .timer-label {
    font-size: 13px;
    color: var(--text-3);
    margin-top: 4px;
    letter-spacing: 2px;
  }

  /* ====== 时间选择 ====== */
  .time-options {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }

  .time-btn {
    background: rgba(255, 255, 255, 0.6);
    border: 1.5px solid rgba(232, 149, 109, 0.2);
    border-radius: 20px;
    padding: 8px 20px;
    font-family: 'Noto Serif SC', serif;
    font-size: 14px;
    color: var(--text-2);
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
  }

  .time-btn:hover {
    background: rgba(255, 255, 255, 0.85);
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(232, 149, 109, 0.15);
  }

  .time-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 20px rgba(232, 149, 109, 0.3);
  }

  /* ====== 主按钮 ====== */
  .start-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--accent) 0%, #d4845f 100%);
    color: #fff;
    border: none;
    border-radius: 30px;
    padding: 14px 42px;
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 6px 25px rgba(232, 149, 109, 0.3);
    letter-spacing: 2px;
  }

  .start-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 35px rgba(232, 149, 109, 0.4);
  }

  .start-btn:active {
    transform: translateY(-1px);
  }

  .start-btn.running {
    background: linear-gradient(135deg, #b5a395 0%, #a09085 100%);
    box-shadow: 0 6px 25px rgba(181, 163, 149, 0.3);
  }

  /* ====== 提醒弹窗 ====== */
  .reminder-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(94, 78, 62, 0.4);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  .reminder-overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .reminder-card {
    background: linear-gradient(160deg, #fffaf4 0%, #fef3e2 100%);
    border-radius: 24px;
    padding: 50px 40px;
    max-width: 380px;
    width: 90%;
    text-align: center;
    transform: scale(0.9) translateY(20px);
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 20px 60px rgba(90, 70, 54, 0.15);
  }

  .reminder-overlay.show .reminder-card {
    transform: scale(1) translateY(0);
  }

  .reminder-emoji {
    font-size: 56px;
    margin-bottom: 20px;
    display: block;
    animation: reminderBounce 0.6s ease-out 0.3s both;
  }

  @keyframes reminderBounce {
    0% { transform: scale(0); }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  .reminder-title {
    font-size: 24px;
    font-weight: 500;
    color: var(--text-1);
    margin-bottom: 12px;
    letter-spacing: 2px;
  }

  .reminder-text {
    font-size: 15px;
    color: var(--text-2);
    line-height: 1.8;
    margin-bottom: 30px;
    font-weight: 300;
  }

  .reminder-close-btn {
    background: rgba(232, 149, 109, 0.1);
    border: 1.5px solid rgba(232, 149, 109, 0.3);
    border-radius: 24px;
    padding: 12px 36px;
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .reminder-close-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* ====== 底部签名 ====== */
  .footer {
    position: fixed;
    bottom: 20px;
    left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: var(--text-3);
    letter-spacing: 1px;
    opacity: 0.6;
    z-index: 1;
  }

  /* ====== 星星飘起动画 ====== */
  .flying-star {
    position: fixed;
    font-size: 24px;
    pointer-events: none;
    z-index: 101;
    animation: flyStar 3s ease-out forwards;
  }

  @keyframes flyStar {
    0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-400px) scale(0.3) rotate(360deg); }
  }

  /* ====== 响应式 ====== */
  @media (max-width: 480px) {
    .main-title { letter-spacing: 2px; }
    .breath-circle { width: 90px; height: 90px; font-size: 36px; }
    .timer-display { width: 160px; height: 160px; }
    .timer-ring { width: 160px; height: 160px; }
    .timer-minutes { font-size: 36px; }
    .reminder-card { padding: 40px 30px; }
  }
</style>
</head>
<body>

<!-- 飘动的云朵 -->
<div class="clouds">
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
</div>

<!-- 光点粒子 -->
<div class="particles" id="particles"></div>

<!-- 主内容 -->
<div class="container">
  <div class="hero-section">
    <div class="breath-circle">☁️</div>
    <h1 class="main-title">休息一下吧</h1>
    <p class="sub-title">你已经在屏幕前坐了很久了<br>给自己几分钟，什么都不做也好的</p>
  </div>

  <div class="timer-section">
    <div class="timer-display">
      <svg class="timer-ring" viewBox="0 0 200 200">
        <circle class="timer-ring-bg" cx="100" cy="100" r="90"></circle>
        <circle class="timer-ring-progress" id="timerProgress" cx="100" cy="100" r="90"></circle>
      </svg>
      <div class="timer-text">
        <div class="timer-minutes" id="timerMinutes">25</div>
        <div class="timer-label" id="timerLabel">分钟</div>
      </div>
    </div>

    <div class="time-options" id="timeOptions">
      <button class="time-btn" data-minutes="5">5 分钟</button>
      <button class="time-btn" data-minutes="10">10 分钟</button>
      <button class="time-btn active" data-minutes="25">25 分钟</button>
      <button class="time-btn" data-minutes="45">45 分钟</button>
    </div>

    <button class="start-btn" id="startBtn">
      <span id="startBtnText">开始休息</span>
    </button>
  </div>
</div>

<!-- 提醒弹窗 -->
<div class="reminder-overlay" id="reminderOverlay">
  <div class="reminder-card">
    <span class="reminder-emoji" id="reminderEmoji">🌿</span>
    <h2 class="reminder-title" id="reminderTitle">休息好了吗？</h2>
    <p class="reminder-text" id="reminderText">站起来走走吧，<br>窗外的光还很好看。</p>
    <button class="reminder-close-btn" id="reminderCloseBtn">好的，我回来啦</button>
  </div>
</div>

<div class="footer">用 AI 做的小工具 · 希望你今天也好好休息</div>

<script>
  // ====== 粒子生成 ======
  const particlesEl = document.getElementById('particles');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.animationDuration = (3 + Math.random() * 4) + 's';
    p.style.animationDelay = Math.random() * 5 + 's';
    p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
    particlesEl.appendChild(p);
  }

  // ====== 计时器逻辑 ======
  const timerMinutes = document.getElementById('timerMinutes');
  const timerLabel = document.getElementById('timerLabel');
  const timerProgress = document.getElementById('timerProgress');
  const startBtn = document.getElementById('startBtn');
  const startBtnText = document.getElementById('startBtnText');
  const timeOptions = document.getElementById('timeOptions');

  let selectedMinutes = 25;
  let totalSeconds = 25 * 60;
  let remainingSeconds = totalSeconds;
  let timerInterval = null;
  let isRunning = false;

  const circumference = 2 * Math.PI * 90; // r=90
  timerProgress.style.strokeDasharray = circumference;
  timerProgress.style.strokeDashoffset = 0;

  // 时间选择
  timeOptions.addEventListener('click', (e) => {
    if (isRunning) return;
    const btn = e.target.closest('.time-btn');
    if (!btn) return;

    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    selectedMinutes = parseInt(btn.dataset.minutes);
    totalSeconds = selectedMinutes * 60;
    remainingSeconds = totalSeconds;
    updateDisplay();
  });

  // 开始/暂停
  startBtn.addEventListener('click', () => {
    if (isRunning) {
      pauseTimer();
    } else {
      startTimer();
    }
  });

  function startTimer() {
    isRunning = true;
    startBtnText.textContent = '暂停';
    startBtn.classList.add('running');

    timerInterval = setInterval(() => {
      remainingSeconds--;
      updateDisplay();

      if (remainingSeconds <= 0) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtnText.textContent = '开始休息';
        startBtn.classList.remove('running');
        remainingSeconds = totalSeconds;
        updateDisplay();
        showReminder();
      }
    }, 1000);
  }

  function pauseTimer() {
    isRunning = false;
    clearInterval(timerInterval);
    startBtnText.textContent = '继续';
    startBtn.classList.remove('running');
  }

  function updateDisplay() {
    const mins = Math.floor(remainingSeconds / 60);
    const secs = remainingSeconds % 60;

    if (remainingSeconds === totalSeconds) {
      timerMinutes.textContent = mins;
      timerLabel.textContent = '分钟';
    } else {
      timerMinutes.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
      timerLabel.textContent = '';
    }

    // 更新进度环
    const progress = 1 - (remainingSeconds / totalSeconds);
    timerProgress.style.strokeDashoffset = circumference * (1 - progress);
  }

  // ====== 提醒弹窗 ======
  const reminderOverlay = document.getElementById('reminderOverlay');
  const reminderCloseBtn = document.getElementById('reminderCloseBtn');

  const reminders = [
    { emoji: '🌿', title: '休息好了吗？', text: '站起来走走吧，<br>窗外的光还很好看。' },
    { emoji: '☕', title: '该喝杯水了', text: '你做得很棒了，<br>现在轮到照顾自己了。' },
    { emoji: '🌅', title: '辛苦了', text: '屏幕外的世界也在等你，<br>去看看吧。' },
    { emoji: '🌷', title: '你今天也很棒', text: '不用急着回去，<br>这几分钟完全属于你。' },
    { emoji: '🌙', title: '放松一下', text: '闭上眼睛，<br>什么都不想，三分钟就好。' },
    { emoji: '✨', title: '嘿，抬头看看', text: '你已经很努力了，<br>允许自己慢下来。' },
  ];

  function showReminder() {
    const reminder = reminders[Math.floor(Math.random() * reminders.length)];
    document.getElementById('reminderEmoji').textContent = reminder.emoji;
    document.getElementById('reminderTitle').textContent = reminder.title;
    document.getElementById('reminderText').innerHTML = reminder.text;

    reminderOverlay.classList.add('show');
    spawnStars();
  }

  reminderCloseBtn.addEventListener('click', () => {
    reminderOverlay.classList.remove('show');
  });

  // ====== 星星飘起效果 ======
  function spawnStars() {
    const stars = ['⭐', '✨', '🌟', '💫'];
    for (let i = 0; i < 8; i++) {
      setTimeout(() => {
        const star = document.createElement('div');
        star.className = 'flying-star';
        star.textContent = stars[Math.floor(Math.random() * stars.length)];
        star.style.left = (30 + Math.random() * 40) + '%';
        star.style.bottom = '30%';
        star.style.fontSize = (18 + Math.random() * 20) + 'px';
        document.body.appendChild(star);
        setTimeout(() => star.remove(), 3000);
      }, i * 200);
    }
  }
</script>
</body>
</html>
